name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Lint baseline is 0 errors (53 warnings, mostly react-hooks/react-refresh).
      # Blocking on errors; warnings are tracked but do not fail CI.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge-function auth unit tests
        run: |
          if [ -f supabase/functions/_shared/auth.test.ts ]; then
            npm run test:security
          else
            echo "auth.test.ts not present on this ref (delivered by the security PR); skipping."
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # --with-deps apt-installs extra fonts; when Ubuntu's mirrors are
        # unreachable (DNS outages on the runner) that fails before any test
        # runs. The runner image already has Chromium's system libraries, so
        # fall back to installing just the browser.
        timeout-minutes: 6
        run: |
          timeout 300 npx playwright install --with-deps chromium \
            || { echo "::warning::apt deps unavailable; installing Chromium only"; npx playwright install chromium; }

      - name: Demo smoke tests
        run: npm run test:e2e
