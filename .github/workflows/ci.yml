name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Lint currently has a large pre-existing error baseline (~273 errors,
      # mostly @typescript-eslint/no-explicit-any). Kept non-blocking until the
      # debt is burned down so CI reflects real type/test/build health.
      # Flip continue-on-error to false once `npm run lint` is clean.
      - name: Lint (non-blocking baseline)
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
