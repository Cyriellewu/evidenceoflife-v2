    <circle cx="22.2" cy="20.2" r="2.9" />
    <circle cx="27.2" cy="20.5" r="2.5" />
    <circle cx="31.2" cy="23.2" r="2.1" />
  </g>
  <!-- Right footprint -->
  <g fill="#C9B59A">
    <ellipse cx="42" cy="36" rx="9.5" ry="13" transform="rotate(16 42 36)" />
    <circle cx="48.5" cy="20.5" r="2.6" />
    <circle cx="43.8" cy="18.2" r="2.9" />
    <circle cx="38.8" cy="18.8" r="2.5" />
